name: CI

on:
  pull_request:
    branches: [main, production]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 채권 계산식 자체 점검 (Python)
        run: python3 pipeline/desk/bondmath.py
      - name: 화면 쪽 계산이 Python과 같은 값을 내는지 (JS)
        run: node desk/assets/bondmath.js check
      - name: 파이프라인 스크립트 문법 확인
        run: python3 -m compileall -q pipeline
      - name: 사이트 빌드 확인
        run: |
          bash scripts/build_site.sh . /tmp/_site
          test -f /tmp/_site/index.html
          test -f /tmp/_site/desk/index.html
          test -f /tmp/_site/desk/data/desk_data.js
          test -f /tmp/_site/curve/index.html
          test -f /tmp/_site/macro/scoreboard_rules.html
