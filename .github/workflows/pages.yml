name: Deploy to GitHub Pages (production → /, main → /beta/)

on:
  push:
    branches: [main, production]
    paths:
      - "desk/**"
      - "pipeline/inputs/**"
      - "site/**"
      - "docs/study/**"
      - "scripts/build_site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: production
          path: _src/production
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _src/main
      # Pages는 저장소당 사이트가 하나라서, 어느 브랜치가 바뀌든 두 브랜치를 모두 다시 올린다.
      - name: Build site (production at /, main at /beta/)
        run: |
          bash scripts/build_site.sh _src/production _site
          bash scripts/build_site.sh _src/main _site/beta
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
